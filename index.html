<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="响叮当托管中心——用心做好每一次辅导，不负每一份家长托付。">
  <title>响叮当托管中心</title>
  <style>
    @font-face {
      font-family: "仓耳渔阳体 Web";
      src: url("assets/fonts/yu-yang-w01.ttf") format("truetype");
      font-weight: 100;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "仓耳渔阳体 Web";
      src: url("assets/fonts/yu-yang-w02.ttf") format("truetype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "仓耳渔阳体 Web";
      src: url("assets/fonts/yu-yang-w03.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "仓耳渔阳体 Web";
      src: url("assets/fonts/yu-yang-w04.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "仓耳渔阳体 Web";
      src: url("assets/fonts/yu-yang-w05.ttf") format("truetype");
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --brand-blue: #05639a;
      --ink: #102d31;
      --accent: #ffeb38;
      --yu-yang: "仓耳渔阳体 Web", "仓耳渔阳体 W03", "仓耳渔阳体";
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: #61d9d3;
      font-family: var(--yu-yang), "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background-image: url("./assets/hero-background.png");
      background-repeat: no-repeat;
      background-position: center top;
      background-size: cover;
    }

    .site-header {
      position: absolute;
      z-index: 3;
      top: 4.7%;
      right: 6.15%;
      left: 5.9%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .brand {
      display: block;
      width: clamp(190px, 12.75vw, 270px);
      line-height: 0;
    }

    .brand img {
      display: block;
      width: 100%;
      height: auto;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: clamp(34px, 3.25vw, 70px);
      padding-top: 0.15rem;
      color: #fff;
      font-size: clamp(1.8rem, 2.35vw, 3rem);
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .desktop-nav a {
      position: relative;
      transition: color 180ms ease, transform 180ms ease;
    }

    .desktop-nav a::after {
      position: absolute;
      right: 0;
      bottom: -0.28em;
      left: 0;
      height: 3px;
      content: "";
      border-radius: 999px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 180ms ease;
    }

    .desktop-nav a:hover,
    .desktop-nav a:focus-visible {
      transform: translateY(-2px);
    }

    .desktop-nav a:hover::after,
    .desktop-nav a:focus-visible::after {
      transform: scaleX(1);
    }

    .desktop-nav .active {
      color: var(--brand-blue);
    }

    .mobile-menu {
      display: none;
    }

    .hero-copy {
      position: absolute;
      z-index: 2;
      top: 29.55%;
      left: 3.75%;
    }

    .hero-copy h1 {
      margin: 0;
      color: #102c30;
      font-size: clamp(5rem, 6.2vw, 7.45rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.12;
      paint-order: stroke fill;
      -webkit-text-stroke: clamp(4px, 0.38vw, 8px) #fff;
      text-shadow: 0 3px 1px rgb(0 0 0 / 8%);
      white-space: nowrap;
    }

    .tagline {
      margin: 0.42em 0 0;
      font-size: clamp(1.7rem, 1.95vw, 2.5rem);
      font-weight: 800;
      letter-spacing: 0.035em;
      line-height: 1.35;
      white-space: nowrap;
    }

    .contact-button {
      display: inline-flex;
      min-width: clamp(240px, 13.5vw, 285px);
      min-height: clamp(72px, 8.25vh, 96px);
      align-items: center;
      justify-content: center;
      margin-top: clamp(3.3rem, 6.5vh, 4.7rem);
      margin-left: clamp(7.5rem, 10.45vw, 13rem);
      padding: 0.45em 1.35em;
      border: clamp(4px, 0.3vw, 6px) solid #fff;
      border-radius: 999px;
      outline: none;
      background: var(--accent);
      box-shadow: 0 3px 4px rgb(0 0 0 / 12%);
      color: #122c31;
      font-size: clamp(1.75rem, 2vw, 2.45rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .contact-button:hover,
    .contact-button:focus-visible {
      background: #fff04c;
      box-shadow: 0 8px 18px rgb(0 96 110 / 24%);
      transform: translateY(-3px);
    }

    .contact-button:active {
      transform: translateY(0);
    }

    @media (max-width: 1100px) {
      .site-header {
        top: 3.2%;
        right: 4%;
        left: 4%;
      }

      .desktop-nav {
        gap: 2.3vw;
        font-size: clamp(1.35rem, 2.25vw, 2rem);
      }

      .hero-copy h1 {
        font-size: clamp(4rem, 6.2vw, 5.3rem);
      }

      .tagline {
        font-size: clamp(1.35rem, 1.95vw, 1.8rem);
      }
    }

    @media (max-width: 760px) {
      .hero {
        min-height: 760px;
        background-position: 57% top;
      }

      .hero::after {
        position: absolute;
        z-index: 0;
        inset: 0;
        content: "";
        background: linear-gradient(180deg, rgb(73 208 202 / 12%) 0%, rgb(73 208 202 / 8%) 34%, rgb(73 208 202 / 78%) 52%, transparent 77%);
        pointer-events: none;
      }

      .site-header {
        top: max(18px, env(safe-area-inset-top));
        right: 18px;
        left: 18px;
        align-items: flex-start;
      }

      .brand {
        width: clamp(148px, 45vw, 185px);
      }

      .desktop-nav {
        display: none;
      }

      .mobile-menu {
        display: block;
        color: #fff;
        font-weight: 700;
      }

      .mobile-menu summary {
        display: flex;
        width: 76px;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border: 2px solid rgb(255 255 255 / 90%);
        border-radius: 999px;
        background: rgb(0 101 150 / 88%);
        cursor: pointer;
        list-style: none;
      }

      .mobile-menu summary::-webkit-details-marker {
        display: none;
      }

      .mobile-menu nav {
        position: absolute;
        top: 56px;
        right: 0;
        display: grid;
        width: min(220px, calc(100vw - 36px));
        overflow: hidden;
        border: 2px solid rgb(255 255 255 / 82%);
        border-radius: 18px;
        background: rgb(0 104 148 / 94%);
        box-shadow: 0 12px 26px rgb(0 64 75 / 24%);
      }

      .mobile-menu a {
        padding: 0.82rem 1.15rem;
        border-bottom: 1px solid rgb(255 255 255 / 22%);
        font-size: 1rem;
        text-align: center;
      }

      .mobile-menu a:last-child {
        border-bottom: 0;
      }

      .mobile-menu .active {
        color: #ffed38;
      }

      .hero-copy {
        top: 35.5%;
        right: 18px;
        left: 18px;
        text-align: center;
      }

      .hero-copy h1 {
        font-size: clamp(3.05rem, 14.5vw, 4.5rem);
        line-height: 1.16;
        white-space: normal;
        -webkit-text-stroke-width: 4px;
      }

      .tagline {
        max-width: 24em;
        margin: 0.65rem auto 0;
        font-size: clamp(1.12rem, 4.5vw, 1.45rem);
        line-height: 1.55;
        white-space: normal;
      }

      .contact-button {
        min-width: 210px;
        min-height: 64px;
        margin: 2.35rem 0 0;
        font-size: 1.55rem;
      }
    }

    @media (max-width: 430px) {
      .hero {
        min-height: 700px;
        background-position: 58.5% top;
      }

      .hero-copy {
        top: 34.5%;
      }

      .hero-copy h1 {
        font-size: clamp(2.75rem, 14vw, 3.8rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="hero" aria-labelledby="hero-title">
    <header class="site-header">
      <a class="brand" href="#" aria-label="响叮当托管中心首页">
        <img src="./assets/xiangdingdang-logo.png" alt="响叮当托管中心">
      </a>

      <nav class="desktop-nav" aria-label="主导航">
        <a class="active" href="#" aria-current="page">首页</a>
        <a href="#environment">环境介绍</a>
        <a href="#philosophy">办学理念</a>
        <a href="#teachers">师资介绍</a>
      </nav>

      <details class="mobile-menu">
        <summary>菜单</summary>
        <nav aria-label="移动端主导航">
          <a class="active" href="#" aria-current="page">首页</a>
          <a href="#environment">环境介绍</a>
          <a href="#philosophy">办学理念</a>
          <a href="#teachers">师资介绍</a>
        </nav>
      </details>
    </header>

    <section class="hero-copy" aria-label="首页介绍">
      <h1 id="hero-title">响叮当托管</h1>
      <p class="tagline">用心做好每一次辅导，不负每一份家长托付</p>
      <button class="contact-button" type="button">联系我们</button>
    </section>
  </main>
</body>
</html>
